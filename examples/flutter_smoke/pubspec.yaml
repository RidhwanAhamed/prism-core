name: prism_smoke
description: "Task 6 smoke app: the Prism Engine core on a physical device via dart:ffi."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.0
  prism_core_bindings:
    path: ../../bindings/dart/prism_core_bindings

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Copies of the repo's placeholder scene (Flutter assets must live inside the
    # package). Extracted to the app's documents dir at first launch — prism_load_scene
    # needs real filesystem paths.
    - assets/scene/
    - assets/scene/stems/
